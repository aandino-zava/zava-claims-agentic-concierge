[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zava-claims-agentic-concierge"
version = "0.1.0"
description = "Deterministic reference and delivery tooling for a Copilot Studio claims concierge"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3"]

[tool.setuptools.packages.find]
where = ["src"]
